<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Audio Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Accessible Audio Explorer</h1>

    <p>Upload an audio recording to begin.</p>

    <input type="file" accept="audio/*">

    <script src="script.js"></script>

</body>

</html>
